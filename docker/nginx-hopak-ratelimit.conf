# ติดตั้งที่ /etc/nginx/conf.d/hopak-ratelimit.conf (http context)
# แยกจาก server blocks เพราะ limit_req_zone ประกาศซ้ำไม่ได้ — ถ้าอยู่ในไฟล์เดียวกับ server
# แล้วเผลอ include สองที่ nginx จะ fail ทันที ("already bound to key")
#
# auth_limit: กัน brute-force login/register — 5 req/วิ ต่อ IP
# api_limit: กันยิงถล่ม API ทั่วไป — 20 req/วิ ต่อ IP
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# ขนาด body สูงสุด — ประกาศที่ http context จะได้มีผลกับทุก server block
# รวมถึง block :443 ที่ certbot คัดลอกออกไปเอง (แก้เฉพาะไฟล์ sites-available จะหลุด block นั้น)
#
# ค่าเริ่มต้นของ nginx คือ 1m ซึ่งเล็กกว่าที่แอปยอมรับมาก:
#   เอกสารยืนยันตัวตน (DOC_LIMIT) 10MB · รูปหอ/ห้อง (IMAGE_LIMIT) 5MB
# รูปถ่ายจากมือถือปกติ 2-5MB จึงโดน nginx คืน 413 ตั้งแต่ยังไม่ถึง API
# ตั้ง 12m เผื่อ overhead ของ multipart ให้เอกสาร 10MB ผ่านได้จริง
client_max_body_size 12m;

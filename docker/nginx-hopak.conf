# Rate limit zones (http context — ไฟล์นี้ include อยู่ใน http block ของ nginx.conf)
# auth_limit: กัน brute-force login/register — 5 req/วิ ต่อ IP
# api_limit: กันยิงถล่ม API ทั่วไป — 20 req/วิ ต่อ IP
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# หน้าเปล่าโดเมนหลัก — ส่งไปที่แอป
# ACME challenge ต้องมาก่อน redirect เสมอ ไม่งั้น certbot ต่ออายุใบรับรองไม่ได้ (โดน 301 ไปหมด)
server {
    listen 80;
    server_name hoprak.com www.hoprak.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://app.hoprak.com$request_uri;
    }
}

server {
    listen 80;
    server_name app.hoprak.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ต้อง proxy จริงที่นี่ — ถ้าปล่อยเป็น return 301 https://app.hoprak.com เฉยๆ
    # certbot จะคัดลอก block นี้ไปเป็น 443 แล้วกลายเป็นวนซ้ำหาตัวเอง เข้าเว็บไม่ได้
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.hoprak.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # login/register/reset — เข้มกว่า (burst 10 แล้วเกินคืน 429)
    location ~ ^/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- โลโก้ H ของ Hopak ให้ตรงกับตราในเว็บ (สี่เหลี่ยมมนไล่สีน้ำเงิน + H ขาว)
       วาด H ด้วยสี่เหลี่ยม ไม่ใช้ <text> เพราะ favicon เรนเดอร์นอกบริบทหน้าเว็บ ฟอนต์ไม่การันตี -->
  <defs>
    <linearGradient id="hopakBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6FE0"/>
      <stop offset="1" stop-color="#1E4FB0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#hopakBg)"/>
  <g fill="#ffffff">
    <rect x="9" y="8" width="4.6" height="16" rx="1.2"/>
    <rect x="18.4" y="8" width="4.6" height="16" rx="1.2"/>
    <rect x="9" y="13.7" width="14" height="4.6" rx="1.2"/>
  </g>
</svg>
